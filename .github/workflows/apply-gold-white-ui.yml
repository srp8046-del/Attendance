name: Apply Leeway gold-white UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final UI
        run: python tools/fix_ui.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Finalize portal UI" && git push)
