name: Complete dark theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dark-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply complete theme system
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          /* LEEWAY_COMPLETE_THEME_V1 */
          :root{--bg:#f4f6f9;--surface:#fff;--surface2:#fbfcfe;--text:#172033;--muted:#697386;--border:#e6d7ad;--gold:#b88a20;--gold2:#d6b86a;--gold-soft:#d6b86a22}
          body.dark{background:#0f1116!important;color:#f4f1e8!important}
          body.dark .side{background:linear-gradient(180deg,#17140f 0%,#0f1116 100%)!important;color:#f4f1e8;border-right-color:#6f551b;box-shadow:8px 0 30px #0008}
          body.dark .logo,body.dark .nav-label{color:#d9bd72}
          body.dark .nav button{color:#d8d0bf}
          body.dark .nav button:hover{background:#d6b86a18;color:#fff}
          body.dark .nav button.active{background:linear-gradient(90deg,#9d7518,#c9a64f);color:#fff}
          body.dark header{background:#15171d!important;color:#f4f1e8;border-bottom-color:#5d491b;box-shadow:0 3px 18px #0006}
          body.dark .content,body.dark .main{color:#f4f1e8}
          body.dark .card{background:#171a21!important;border-color:#4d3c1a!important;color:#f4f1e8;box-shadow:0 10px 30px #0004}
          body.dark .card:hover{box-shadow:0 14px 38px #0007}
          body.dark .kpi small,body.dark .kpi span,body.dark .hero p,body.dark .drop p,body.dark .rule-card p,body.dark .empty,body.dark .setting-row,body.dark #dataStatus,body.dark #rowStat{color:#aaa99f!important}
          body.dark .kpi:after{background:#d6b86a12}
          body.dark .mini div{background:#11141a!important;border-color:#3b321f;color:#aaa99f}
          body.dark .mini b{color:#f4f1e8}
          body.dark .drop{background:#12151b;border-color:#65521f;color:#f4f1e8}
          body.dark .drop:hover{border-color:#d6b86a;background:#1b1913}
          body.dark .notice{background:#281b18;border-color:#6b3028;color:#f0b5aa}
          body.dark .filters input,body.dark .filters select{background:#11141a!important;color:#f4f1e8!important;border-color:#4b4029}
          body.dark .filters input::placeholder{color:#77786f}
          body.dark .filters input:focus,body.dark .filters select:focus{border-color:#d6b86a;box-shadow:0 0 0 3px #d6b86a18}
          body.dark .tablewrap{background:#11141a;border-color:#403820}
          body.dark .table{color:#eeeae0}
          body.dark .table th{background:#1b1d23;color:#cfc7b5;border-bottom-color:#403820}
          body.dark .table td{border-bottom-color:#292a2f}
          body.dark .table tbody tr:hover{background:#242014}
          body.dark .btn{background:#191b20!important;color:#f0eadc;border-color:#59481f}
          body.dark .btn:hover{border-color:#d6b86a}
          body.dark .primary{background:linear-gradient(90deg,#9d7518,#d6b86a)!important;color:#fff;border-color:#b88a20}
          body.dark .progress{background:#292b30}
          body.dark .login{background:radial-gradient(circle at 80% 15%,#302711 0,#17140f 38%,#090b0f 100%)!important}
          body.dark .loginbox{background:#171a21!important;color:#f4f1e8;border-color:#6b531f;box-shadow:0 30px 90px #000c}
          body.dark .loginbox>p{color:#aaa99f}
          body.dark .loginbox input{background:#101319;color:#f4f1e8;border-color:#4b4029}
          body.dark .loginbox input::placeholder{color:#77786f}
          body.dark .section-title,body.dark .hero h2,body.dark header h1{color:#f4f1e8}
          body.dark .pill{background:#173426;color:#78d6a2}
          body.dark .eyebrow{color:#d6b86a}
          body.dark .toast{background:#f4f1e8;color:#15171d}
          /* Keep semantic attendance status colours readable in dark mode */
          body.dark .PRESENT{background:#143c2a;color:#76d9a4}
          body.dark .LATE{background:#453016;color:#f0bf65}
          body.dark .HALFDAY{background:#472719;color:#f2a46d}
          body.dark .ABSENT{background:#481d1b;color:#ff9187}
          body.dark .NOT{background:#1d2c43;color:#9ebce8}
          body.dark .side .brandmark{background:#fff;border-color:#c49b3a}
          body.dark .login .brandmark{background:#fff;border-color:#c49b3a}
          '''

          marker='</style>'
          if 'LEEWAY_COMPLETE_THEME_V1' not in s:
              s=s.replace(marker, css+'\n'+marker, 1)

          s=s.replace('<meta name="theme-color" content="#e60012">','<meta name="theme-color" content="#b88a20">')

          old='function toggleTheme(){document.body.style.background=document.body.style.background?"":"#111";document.body.style.color=document.body.style.color?"":"#fff"}'
          if old in s:
              s=s.replace(old,'function toggleTheme(){document.body.classList.toggle("dark");localStorage.setItem("leeway-theme",document.body.classList.contains("dark")?"dark":"light")}')
          else:
              anchor='</script>'
              theme_js='<script>if(localStorage.getItem("leeway-theme")==="dark")document.body.classList.add("dark");</script>'
              if 'leeway-theme' not in s:
                  s=s.replace(anchor,theme_js+'\n'+anchor,1)

          p.write_text(s,encoding='utf-8')

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Complete dark theme across all portal components"
          git push