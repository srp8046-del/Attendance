name: Fix Leeway logo fit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logo:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Leeway logo fit') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply precise logo sizing
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* LEEWAY_LOGO_FIT_V2 */'
          if marker in s:
              print('Logo fix already present')
              raise SystemExit(0)
          css = '''\n/* LEEWAY_LOGO_FIT_V2 */\n.brandrow{width:100%;height:104px;margin:0 0 12px;display:flex;align-items:center;justify-content:center}\n.side .brandmark{width:100%;height:104px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #d6b86a;border-radius:12px;padding:8px;overflow:hidden;box-shadow:0 5px 16px #8b6a1f18}\n.side .brandmark img{display:block;width:auto;height:auto;max-width:96%;max-height:88px;object-fit:contain;flex:0 0 auto}\n.login .brandrow{height:auto;margin:0 0 12px}\n.login .brandmark{display:flex;align-items:center;justify-content:center;width:100%;height:96px;padding:10px;overflow:hidden}\n.login .brandmark img{display:block;width:auto;height:auto;max-width:92%;max-height:76px;object-fit:contain}\n@media(max-width:850px){.brandrow{height:64px;margin-bottom:10px}.side .brandmark{width:58px;height:64px;padding:5px}.side .brandmark img{max-width:96%;max-height:52px}}\n'''
          s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Leeway logo fit"
          git push
