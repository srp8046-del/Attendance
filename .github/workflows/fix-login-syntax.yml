name: Fix login syntax
on:
  push:
    paths:
      - '.github/workflows/fix-login-syntax.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair broken fmtClock function
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('function fmtClock(v){')
          end = s.find('function statusByHours', start)
          if start < 0 or end < 0:
              raise SystemExit('fmtClock/statusByHours markers not found')
          new = '''function fmtClock(v){
            if(v===null||v===undefined||v==='')return'';
            if(typeof v==='string'){
              const raw=v.trim();
              const m=raw.match(/^(\\d{1,2}):(\\d{2})(?::(\\d{2}))?\\s*(AM|PM)?$/);
              if(m){
                let h=Number(m[1]),mi=Number(m[2]),se=m[3]===undefined?0:Number(m[3]);
                if(m[4]==='PM'&&h<12)h+=12;
                if(m[4]==='AM'&&h===12)h=0;
                if(h>=0&&h<=23&&mi>=0&&mi<=59){
                  const ap=h>=12?'PM':'AM',hh=h%12||12;
                  if(h===0&&mi===0&&se===0)return'00:00';
                  return String(hh).padStart(2,'0')+':'+String(mi).padStart(2,'0')+' '+ap;
                }
              }
            }
            let n=Number(v);
            if(Number.isFinite(n)){
              if(n===0)return'00:00';
              if(n>=0&&n<1){
                const total=Math.round(n*86400),h=Math.floor(total/3600)%24,mi=Math.floor(total%3600/60);
                const ap=h>=12?'PM':'AM',hh=h%12||12;
                return String(hh).padStart(2,'0')+':'+String(mi).padStart(2,'0')+' '+ap;
              }
            }
            return String(v);
          }
          '''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit repaired index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix login JavaScript syntax error"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-login-syntax.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary login fix workflow" || true
          git push || true
