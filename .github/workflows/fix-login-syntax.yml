name: Fix login syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove invalid JavaScript line-continuation characters
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          fixed = s.replace('\\\n', '\n')
          if fixed == s:
              print('No invalid trailing backslash characters found.')
          else:
              p.write_text(fixed, encoding='utf-8')
              print('Removed invalid trailing backslash characters.')
          PY
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          if re.search(r'\\\\\n', s):
              raise SystemExit('Invalid trailing backslash remains in index.html')
          if 'function login()' not in s:
              raise SystemExit('login() function missing')
          print('Login function and JavaScript source checks passed.')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix login JavaScript syntax definitively'
          git push
