name: Fix login syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed attendance date helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='function attendanceDateKey(d){n'
          if marker in s:
              start=s.index(marker)
              prefix=s[:start]
              while prefix.endswith('\\') or prefix.endswith('\n') or prefix.endswith('\r'):
                  prefix=prefix[:-1]
              end=s.index('</script>',start)
              good="""function attendanceDateKey(d){
            if(!(d instanceof Date) || Number.isNaN(d.getTime())) return '';
            return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          }
          function attendanceDateFromYMD(y,m,d){
            y=Number(y); m=Number(m); d=Number(d);
            if(!Number.isInteger(y)||!Number.isInteger(m)||!Number.isInteger(d)||m<0||m>11||d<1) return '';
            const x=new Date(y,m,d);
            if(x.getFullYear()!==y || x.getMonth()!==m || x.getDate()!==d) return '';
            return attendanceDateKey(x);
          }
          function attendanceDateOnly(v){
            if(v instanceof Date) return attendanceDateKey(v);
            if(typeof v==='number' && window.XLSX && XLSX.SSF){
              const x=XLSX.SSF.parse_date_code(v);
              if(x && x.y && x.m && x.d) return attendanceDateFromYMD(x.y,x.m-1,x.d);
            }
            const t=String(v??'').trim();
            let m=t.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);
            if(m) return attendanceDateFromYMD(m[1],Number(m[2])-1,m[3]);
            m=t.match(/^(\\d{1,2})[\\/-](\\d{1,2})[\\/-](\\d{4})$/);
            if(m) return attendanceDateFromYMD(m[3],Number(m[2])-1,m[1]);
            return '';
          }
          """
              s=prefix+good+s[end:]
              p.write_text(s,encoding='utf-8')
              print('Attendance date helper repaired.')
          else:
              print('Attendance date helper already valid.')
          PY
      - name: Install robust login handler
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          hotfix = r'''<!-- LEeway-login-hotfix -->
          <script>
          (function(){
            function byId(id){return document.getElementById(id);}
            function showApp(){
              var loginBox=byId('login'), app=byId('app');
              if(loginBox) loginBox.classList.add('hidden');
              if(app) app.classList.remove('hidden');
            }
            function storageSet(k,v){try{sessionStorage.setItem(k,v);}catch(_){}}
            function storageGet(k){try{return sessionStorage.getItem(k);}catch(_){return null;}}
            function storageRemove(k){try{sessionStorage.removeItem(k);}catch(_){}
            }
            function doLogin(){
              var u=byId('user'), p=byId('pass'), e=byId('loginErr');
              var username=u ? u.value.trim() : '';
              var password=p ? p.value : '';
              if(!username || !password){
                if(e) e.textContent='Enter username and password.';
                return false;
              }
              if(e) e.textContent='';
              showApp();
              storageSet('lw_auth','1');
              storageSet('lw_user',username);
              try{ if(typeof updateKPIs==='function') updateKPIs(); }catch(_){ }
              return false;
            }
            window.login=doLogin;
            window.logout=function(){
              storageRemove('lw_auth');
              storageRemove('lw_user');
              location.reload();
            };
            function bind(){
              var btn=document.querySelector('#login .btn.primary');
              if(btn) btn.onclick=doLogin;
              var u=byId('user'), p=byId('pass');
              [u,p].forEach(function(el){
                if(el) el.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doLogin();}});
              });
              if(storageGet('lw_auth')==='1') showApp();
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind); else bind();
          })();
          </script>
          '''
          pattern = r'<!-- LEeway-login-hotfix -->.*?</script>\s*(?=</body>)'
          if re.search(pattern, s, flags=re.S):
              s = re.sub(pattern, hotfix.rstrip(), s, count=1, flags=re.S)
          else:
              if '</body>' not in s:
                  raise SystemExit('Could not find closing body tag')
              s = s.replace('</body>', hotfix + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('Robust login handler installed.')
          PY
      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          errors=[]
          for i,code in enumerate(scripts,1):
              p=Path(f'/tmp/script{i}.js'); p.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],text=True,capture_output=True)
              if r.returncode: errors.append(f'SCRIPT {i}: {r.stderr}')
          if errors: raise SystemExit('\n'.join(errors))
          print(f'Validated {len(scripts)} embedded scripts: all OK')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair attendance runtime and sign-in'
          git push
