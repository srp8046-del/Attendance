name: Fix zero BIO punch display
on:
  push:
    paths:
      - '.github/workflows/fix-zero-punch.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch zero punch handling
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='function fmtClock(v){'
          i=s.find(old)
          if i<0:
            raise SystemExit('fmtClock not found')
          j=s.find('}', i)
          if j<0:
            raise SystemExit('fmtClock end not found')
          end=j+1
          block=s[i:end]
          if '00:00' in block and 'zero' in block.lower():
            pass
          else:
            new='''function fmtClock(v){\n  if(v===null||v===undefined||v==='')return'';\n  if(typeof v==='string'){\n    const raw=v.trim();\n    const m=raw.match(/^(\\d{1,2}):(\\d{2})(?::(\\d{2}))?$/);\n    if(m){\n      const h=Number(m[1]),mi=Number(m[2]),se=m[3]===undefined?0:Number(m[3]);\n      if(h===0&&mi===0&&se===0)return'00:00';\n      const ap=h>=12?'PM':'AM',hh=h%12||12;\n      return String(hh).padStart(2,'0')+':'+String(mi).padStart(2,'0')+' '+ap;\n    }\n  }\n  let n=Number(v);\n  if(Number.isFinite(n)){\n    if(n===0)return'00:00';\n    if(n>=0&&n<1){\n      const total=Math.round(n*86400),h=Math.floor(total/3600)%24,mi=Math.floor(total%3600/60);\n      const ap=h>=12?'PM':'AM',hh=h%12||12;\n      return String(hh).padStart(2,'0')+':'+String(mi).padStart(2,'0')+' '+ap;\n    }\n  }\n  return String(v);\n}'''
            s=s[:i]+new+s[end:]
            p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Preserve 00:00 as missing BIO punch"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-zero-punch.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary zero punch fix workflow" || true
          git push || true