name: Final Attendance Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final attendance layout
        run: python tools/final_attendance_layout.py
      - name: Commit layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Final attendance layout already applied"
          else
            git commit -m "Set final attendance agent columns and shortcuts"
            git push
          fi
