name: Final Attendance Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair login JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('function attendanceDateKey(d)')
          end=s.find('</script>', start)
          if start < 0 or end < 0:
              raise SystemExit('Attendance date helper block not found')
          block=s[start:end]
          block=block.replace('\\\n','\n')
          block=block.replace('\\\r\n','\n')
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit login repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Login syntax already clean"
          else
            git commit -m "Fix login JavaScript syntax"
            git push
          fi
