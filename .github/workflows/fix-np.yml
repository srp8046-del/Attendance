name: Fix BIO punch status
on:
  push:
    paths:
      - '.github/workflows/fix-np.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix status logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function bioStatus(hours,bin,e){/* one missing punch is always NP */if(hours==null||bin==null)return'NOT PUNCHED';const s=shiftIn(e);if(hours<240)return'ABSENT';if(s==null)return statusByHours(hours);if(bin<=s)return'PRESENT';if(bin<=s+60)return'LATE';return'HALFDAY'}"""
          new="""function bioStatus(hours,bin,bout,e){if(bin==null&&bout==null)return'ABSENT';if(bin==null||bout==null)return'NOT PUNCHED';const s=shiftIn(e);if(hours==null)return'NOT PUNCHED';if(hours<240)return'ABSENT';if(s==null)return statusByHours(hours);if(bin<=s)return'PRESENT';if(bin<=s+60)return'LATE';return'HALFDAY'}"""
          if old not in s:
              raise SystemExit('Old bioStatus function not found')
          s=s.replace(old,new,1)
          old2="const bs=bioStatus(hours,a,e);"
          new2="const bs=bioStatus(hours,a,z,e);"
          if old2 not in s:
              raise SystemExit('Old bioStatus call not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix BIO missing punch status logic' || exit 0
          git push
          rm -f .github/workflows/fix-np.yml
          git add .github/workflows/fix-np.yml
          git commit -m 'Remove temporary fix workflow' || true
          git push || true
