name: Fix BIO 24h time parsing
on:
  push:
    paths:
      - '.github/workflows/fix-bio-time.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch time parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_time=r'''function timeMin(v){
          if(v===null||v===undefined||v==='')return null;
          if(typeof v==='number'&&Number.isFinite(v)){
            if(v>=0&&v<1)return v*1440;
            if(v>=0&&v<1440)return v;
          }
          if(v instanceof Date&&!isNaN(v))return v.getHours()*60+v.getMinutes()+v.getSeconds()/60;
          const s=String(v).trim();
          let m=s.match(/(?:^|\s)(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s*([AaPp][Mm]))?/);
          if(!m)return null;
          let h=Number(m[1]),mi=Number(m[2]),sec=Number(m[3]||0);
          if(mi>59||sec>59)return null;
          const ap=(m[4]||'').toUpperCase();
          if(ap){if(h<1||h>12)return null;if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;}
          else if(h>23)return null;
          return h*60+mi+sec/60;
          }'''
          pat=r'function timeMin\(v\)\{.*?\n\s*\}'
          s2,n=re.subn(pat,new_time,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('timeMin function not found')
          s=s2
          new_fmt=r'''function fmtClock(v){
          if(v===null||v===undefined||v==='')return'—';
          const total=Math.round(Number(v)*60);
          if(!Number.isFinite(total))return'—';
          let h=Math.floor(total/3600)%24, m=Math.floor((total%3600)/60);
          const ap=h>=12?'PM':'AM', hh=(h%12)||12;
          return `${String(hh).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ap}`;
          }'''
          pat2=r'function fmtClock\(v\)\{.*?\n\s*\}'
          s2,n=re.subn(pat2,new_fmt,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('fmtClock function not found')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix BIO 24-hour time parsing'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-bio-time.yml || true
          git diff --cached --quiet || git commit -m 'Remove temporary BIO time fix workflow'
          git push || true
