name: Apply Leeway International branding

on:
  push:
    paths:
      - '.github/workflows/apply-leeway-branding.yml'

permissions:
  contents: write

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update logo presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '.brandmark{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:9px;background:#fff;margin-right:9px;overflow:hidden;flex:0 0 42px}.brandmark img{width:100%;height:100%;object-fit:contain;padding:3px}'
          new = '.brandmark{display:inline-grid;place-items:center;width:92px;height:54px;border-radius:10px;background:#fff;margin-right:12px;overflow:hidden;flex:0 0 92px}.brandmark img{width:100%;height:100%;object-fit:contain;padding:2px}'
          s = s.replace(old, new)

          s = s.replace('<span class="brandmark"><img src="https://leewayinternational.com/img/FINAL_LEEWAY.png" alt="Leeway International"></span><div class="logo" style="color:#111;padding:0">LEEWAY <b>INTERNATIONAL</b></div>', '<span class="brandmark"><img src="https://leewayinternational.com/img/FINAL_LEEWAY.png" alt="Leeway International"></span>')
          s = s.replace('<span class="brandmark"><img src="https://leewayinternational.com/img/FINAL_LEEWAY.png" alt="Leeway International"></span><div class="logo">LEEWAY <b>INTERNATIONAL</b></div>', '<span class="brandmark"><img src="https://leewayinternational.com/img/FINAL_LEEWAY.png" alt="Leeway International"></span>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes needed" || git commit -m "Make Leeway logo larger and remove duplicate text"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/apply-leeway-branding.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Remove one-time branding workflow"
          git push

# trigger: larger left-sidebar logo and no duplicate company-name text
