name: Apply Leeway International branding

on:
  push:
    paths:
      - '.github/workflows/apply-leeway-branding.yml'

permissions:
  contents: write

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch branding without touching attendance logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<title>Leeway Attendance Master</title>', '<title>Leeway International | Attendance Master</title>')
          s = s.replace('<meta name="theme-color" content="#e60012">', '<meta name="theme-color" content="#e60012">\n<link rel="icon" type="image/png" href="https://leewayinternational.com/img/FINAL_LEEWAY.png">')

          old_css = '.brandmark{display:inline-grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#e60012;color:#fff;margin-right:8px;font-size:14px;font-weight:900}'
          new_css = '.brandmark{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:9px;background:#fff;margin-right:9px;overflow:hidden;flex:0 0 42px}.brandmark img{width:100%;height:100%;object-fit:contain;padding:3px}'
          s = s.replace(old_css, new_css)

          s = s.replace('<span class="brandmark">L</span><div class="logo" style="color:#111;padding:0">LEEWAY <b>ATTENDANCE</b></div>', '<span class="brandmark"><img src="https://leewayinternational.com/img/FINAL_LEEWAY.png" alt="Leeway International"></span><div class="logo" style="color:#111;padding:0">LEEWAY <b>INTERNATIONAL</b></div>')
          s = s.replace('<span class="brandmark">L</span><div class="logo">LEEWAY <b>ATTENDANCE</b></div>', '<span class="brandmark"><img src="https://leewayinternational.com/img/FINAL_LEEWAY.png" alt="Leeway International"></span><div class="logo">LEEWAY <b>INTERNATIONAL</b></div>')

          s = s.replace('<h1>Attendance Master</h1><p>Corporate attendance control centre</p>', '<h1>Leeway International</h1><p>Attendance Management System</p>')
          s = s.replace('<h1 id="title">Attendance Dashboard</h1>', '<h1 id="title">Leeway International — Attendance Dashboard</h1>')
          s = s.replace('<div class="eyebrow">Leeway International</div>', '<div class="eyebrow">Leeway International</div>')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit branding update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No branding changes needed" || git commit -m "Update portal branding to Leeway International"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/apply-leeway-branding.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Remove one-time branding workflow"
          git push
