name: Fix Attendance Date
on:
  push:
    paths:
      - '.github/workflows/fix-date.yml'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch date handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          helper=r'''\nfunction attendanceDateKey(d){\n  if(!(d instanceof Date) || Number.isNaN(d.getTime())) return '';\n  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n}\nfunction attendanceDateFromYMD(y,m,d){\n  y=Number(y); m=Number(m); d=Number(d);\n  if(!Number.isInteger(y)||!Number.isInteger(m)||!Number.isInteger(d)||m<0||m>11||d<1) return '';\n  const x=new Date(y,m,d);\n  if(x.getFullYear()!==y || x.getMonth()!==m || x.getDate()!==d) return '';\n  return attendanceDateKey(x);\n}\nfunction attendanceDateOnly(v){\n  if(v instanceof Date) return attendanceDateKey(v);\n  if(typeof v==='number' && window.XLSX && XLSX.SSF){\n    const x=XLSX.SSF.parse_date_code(v);\n    if(x && x.y && x.m && x.d) return attendanceDateFromYMD(x.y,x.m-1,x.d);\n  }\n  const t=String(v??'').trim();\n  let m=t.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);\n  if(m) return attendanceDateFromYMD(m[1],Number(m[2])-1,m[3]);\n  m=t.match(/^(\\d{1,2})[\\/-](\\d{1,2})[\\/-](\\d{4})$/);\n  if(m) return attendanceDateFromYMD(m[3],Number(m[2])-1,m[1]);\n  return '';\n}\n'''
          if 'function attendanceDateKey' not in s:
              pos=s.rfind('</script>')
              if pos<0: raise SystemExit('No script closing tag')
              s=s[:pos]+helper+s[pos:]
          # Replace common date-only ISO conversions that shift midnight dates in IST.
          patterns=[
            (r'new Date\\(([^()\\n]+)\\)\\.toISOString\\(\\)\\.slice\\(0,10\\)', r'attendanceDateKey(new Date(\1))'),
            (r'new Date\\(([^()\\n]+)\\)\\.toJSON\\(\\)\\.slice\\(0,10\\)', r'attendanceDateKey(new Date(\1))'),
          ]
          for pat,repl in patterns:
              s,n=re.subn(pat,repl,s)
              print('replacement',n,pat)
          # Known Y/M/D constructions should never be serialized through UTC.
          s=s.replace("new Date(reportYear,reportMonth,day).toISOString().slice(0,10)","attendanceDateFromYMD(reportYear,reportMonth,day)")
          s=s.replace("new Date(year,month,day).toISOString().slice(0,10)","attendanceDateFromYMD(year,month,day)")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix attendance date timezone conversion'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-date.yml || true
          git diff --cached --quiet || git commit -m 'Remove temporary date fix workflow'
          git push || true
