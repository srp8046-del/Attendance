name: Fix UI layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix sidebar alignment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.side{position:fixed;inset:0 auto 0 0;width:245px;background:#10151d;color:#fff;padding:20px 14px}'
          new = '*,*::before,*::after{box-sizing:border-box}.side{position:fixed;inset:0 auto 0 0;width:245px;background:#10151d;color:#fff;padding:20px 14px}'
          if old not in s:
              raise SystemExit('Expected sidebar CSS was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit layout fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix sidebar and main content alignment'
          git push
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/fix-ui-layout.yml
          git add .github/workflows/fix-ui-layout.yml
          git commit -m 'Remove one-time UI fix workflow' || true
          git push || true
