name: Fix Attendance Date Final
on:
  push:
    paths:
      - '.github/workflows/fix-date-final.yml'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact date fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="DATE:d.toISOString().slice(0,10)"
          new="DATE:attendanceDateFromYMD(reportYear,reportMonth,day)"
          if old not in s:
              raise SystemExit('Expected BIO date expression not found')
          s=s.replace(old,new,1)
          start=s.index('function cleanDate(v){')
          end=s.index('\nfunction parseBIOWorkbook',start)
          new_clean="""function cleanDate(v){const s=String(v??'').trim();if(!s)return'';let m=s.match(/^(\\d{1,2})[-\\/]([A-Za-z]{3,9})[-\\/](\\d{4})$/);if(m){const mo={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11}[m[2].slice(0,3).toUpperCase()];return mo===undefined?'':attendanceDateFromYMD(m[3],mo,m[1])}m=s.match(/^(\\d{4})[-\\/](\\d{1,2})[-\\/](\\d{1,2})/);if(m)return attendanceDateFromYMD(m[1],Number(m[2])-1,m[3]);m=s.match(/^(\\d{1,2})[-\\/](\\d{1,2})[-\\/](\\d{4})$/);if(m)return attendanceDateFromYMD(m[3],Number(m[2])-1,m[1]);return''}"""
          s=s[:start]+new_clean+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix BIO and TOS date parsing without timezone shift'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-date-final.yml || true
          git diff --cached --quiet || git commit -m 'Remove temporary date fix workflow'
          git push || true
