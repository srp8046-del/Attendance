<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leeway International | Attendance Master</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font:14px Inter,Segoe UI,Arial,sans-serif;background:#f4f6f9;color:#172033}.login{min-height:100vh;display:grid;place-items:center;background:#ead9aa;padding:20px}.loginbox{width:min(450px,94vw);background:#fffdf8;border-radius:22px;padding:34px;box-shadow:0 30px 90px #0008}.loginbox input{width:100%;padding:13px;margin:6px 0}.btn{padding:10px 14px;border-radius:10px}.primary{background:#b88a20;color:#fff}.error{min-height:18px;color:#c92a2a;font-size:12px}.hidden{display:none!important}</style></head><body><div id="login" class="login"><div class="loginbox"><h1>Leeway International</h1><p>Attendance Management System</p><input id="user" autocomplete="username" placeholder="Username"><input id="pass" type="password" autocomplete="current-password" placeholder="Password"><div id="loginErr" class="error"></div><button class="btn primary" onclick="login()">Sign in</button></div></div><div id="app" class="hidden"><h1>Leeway International — Attendance Dashboard</h1><button class="btn" onclick="logout()">Logout</button><p>Attendance application restored.</p></div><script>const state={master:[],bio:[],tos:[],records:[],files:{},bioYear:null};const sev={PRESENT:1,LATE:2,HALFDAY:3,ABSENT:4,'NOT PUNCHED':5};const label={PRESENT:'P',LATE:'LC',HALFDAY:'HD',ABSENT:'A','NOT PUNCHED':'NP'};const $=id=>document.getElementById(id);function login(){const u=$('user').value.trim(),p=$('pass').value;if(!u||!p){$('loginErr').textContent='Enter username and password.';return}sessionStorage.setItem('lw_auth','1');sessionStorage.setItem('lw_user',u);$('loginErr').textContent='';$('login').classList.add('hidden');$('app').classList.remove('hidden')}function logout(){sessionStorage.removeItem('lw_auth');sessionStorage.removeItem('lw_user');location.reload()}if(sessionStorage.getItem('lw_auth')==='1'){$('login').classList.add('hidden');$('app').classList.remove('hidden')}</script></body></html>
